{% extends 'base.html' %}
{% block title %}Ключ доступа — ExamPrep{% endblock %}
{% block content %}
<section class="panel auth">
  <h1>Ключ доступа</h1>
  <p class="muted">Введи ключ, который выдал автор методички. После проверки откроются полные инструкции и команды для скачивания скриптов.</p>
  {% if error %}<div class="notice notice-error">{{ error }}</div>{% endif %}
  <form method="post" action="/unlock" class="stack">
    <label>Ключ<input name="key" placeholder="Вставь ключ сюда" required autocomplete="off" autofocus></label>
    <button class="btn">Активировать доступ</button>
  </form>
</section>
{% endblock %}
