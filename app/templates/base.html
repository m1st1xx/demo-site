<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}ExamPrep — демонстрационный экзамен{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">ExamPrep</a>
  <nav>
    <a href="/">Материалы</a>
    {% if full %}<form action="/lock" method="post"><button class="link">Закрыть доступ</button></form>
    {% else %}<a href="/unlock">Ввести ключ</a>{% endif %}
    <a href="/admin">Админ-панель</a>
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
<footer>Учебные материалы для подготовки к демонстрационному экзамену · ExamPrep</footer>
<script>
// адрес берём из адресной строки: за reverse proxy сервер не знает свой публичный URL
document.querySelectorAll('[data-wget]').forEach(box => {
  const code = box.querySelector('code'), btn = box.querySelector('button');
  code.textContent = 'wget ' + location.origin + box.dataset.wget;
  btn.onclick = () => {
    getSelection().selectAllChildren(code); // без HTTPS clipboard недоступен — остаётся выделение под Ctrl+C
    navigator.clipboard?.writeText(code.textContent).then(() => { btn.textContent = 'Скопировано'; });
  };
});
</script>
</body>
</html>
